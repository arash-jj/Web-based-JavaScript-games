<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Message Bus for Decoupled Components</title>
    <style>
      .component {
        border: 1px solid #ccc;
        margin: 10px;
        padding: 10px;
      }
      .header {
        background: #e3f2fd;
      }
      .sidebar {
        background: #fce4ec;
      }
      .main {
        background: #e8f5e9;
      }
    </style>
    <script type="module" src="./js/event-emitter.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="header" class="component header"></div>
      <div id="sidebar" class="component sidebar"></div>
      <div id="main" class="component main"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
